# u-blox NEO-M8P-2 (el driver lo identifica con firmware HPG 1.40 REF, protocolo 20.30) por USB CDC-ACM — parámetros del nodo ublox_gps.
# Receptor adicional de la ZED Box (el GNSS integrado de la ZED Box es otro dispositivo, 1546:01a9).
#
# No se guarda nada en la memoria del receptor (sin `save`): la configuración es volátil y se
# vuelve a aplicar al arrancar el nodo. Por USB la velocidad en baudios no importa.
ublox_gps_node:
  ros__parameters:
    device: /dev/ublox          # regla udev udev/99-ublox.rules (idProduct 01a8)
    frame_id: gps_ublox_link    # mismo frame que el fragmento de descripción
    config_on_startup: true
    rate: 5.0                     # Hz de medida (GPS+GLONASS en M8 admite hasta 10 Hz)
    nav_rate: 1                 # una solución por medida
    dynamic_model: automotive   # vehículo terrestre
    fix_mode: auto
    tmode3: 0                   # el receptor es un NEO-M8P-2 con firmware HPG REF (base RTK): el driver exige este
                                # parámetro; 0 = modo base desactivado (receptor normal, sin survey-in)
    uart1:
      baudrate: 115200
    gnss:
      gps: true
      glonass: true
      beidou: false
      galileo: false
      qzss: false
      sbas: false               # SBAS no mejora nada en el recinto de pruebas y consume canales
    inf:
      all: false
    publish:
      all: false
      nav:
        pvt: true               # lo que usa el nodo para NavSatFix, velocidad y hora
        status: true
      aid:
        hui: false
      mon:
        hw: true                # estado de la antena
